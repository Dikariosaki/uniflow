services:
  api:
    build:
      context: ./api
      dockerfile: UniFlow.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      PORT: 8080
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Supabase: ${SUPABASE_DB_CONNECTION:-}
      Supabase__Url: ${SUPABASE_URL:-}
      Supabase__InternalUrl: ${SUPABASE_INTERNAL_URL:-${SUPABASE_URL:-}}
      Supabase__AnonKey: ${SUPABASE_ANON_KEY:-}
      Supabase__ServiceRoleKey: ${SUPABASE_SERVICE_ROLE_KEY:-}
      Supabase__JwtAudience: ${SUPABASE_JWT_AUDIENCE:-authenticated}
      Supabase__ProductBucket: ${SUPABASE_PRODUCT_BUCKET:-product-images}
      App__PublicUrl: ${APP_PUBLIC_URL:-http://localhost:8080}
      AllowedOrigins: ${ALLOWED_ORIGINS:-http://localhost:8080}
      Database__MigrateOnStartup: ${MIGRATE_ON_STARTUP:-false}
      Storage__EnsureBucketOnStartup: ${ENSURE_STORAGE_BUCKET_ON_STARTUP:-true}
      RateLimiting__PublicRequestsPerMinute: ${PUBLIC_REQUESTS_PER_MINUTE:-30}
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8080"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-/api}
        SUPABASE_URL: ${SUPABASE_URL:-}
        SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: 80
      API_BASE_URL: ${API_BASE_URL:-/api}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
